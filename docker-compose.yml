# Local development services: Postgres (accounts) and Redis (sessions, limits)
# Usage: docker compose up -d && (cd backend && npm run migrate)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gaming_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
